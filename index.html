
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Friday Night Funkin' - Psych Engine 0.6.3</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: Arial, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        #error-message {
            display: none;
            position: absolute;
            inset: 0;
            padding: 25px;
            color: white;
            background: #151515;
            font-family: monospace;
            white-space: pre-wrap;
            overflow: auto;
            z-index: 10000;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <div id="error-message"></div>
    </div>

    <script>
        window.addEventListener("error", function (event) {
            console.error(
                "[HTML Error]",
                event.message,
                event.filename,
                event.lineno
            );
        });

        window.addEventListener(
            "unhandledrejection",
            function (event) {
                console.error(
                    "[HTML Promise Error]",
                    event.reason
                );
            }
        );
    </script>

    <!-- Psych Engine JavaScript -->
    <script src="PsychEngine.js"></script>

</body>
</html>
